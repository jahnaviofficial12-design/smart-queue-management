<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Queue Management</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <h1>Smart Queue Management</h1>

        <p>Simple Digital Queue System</p>

    </header>

    <main>

        <section class="card">

            <h2>Join Queue</h2>

            <form id="queueForm">

                <label>Student Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

                <label>Select Service</label>

                <select id="service" required>

                    <option value="">
                        Select Service
                    </option>

                    <option value="Admissions">
                        Admissions
                    </option>

                    <option value="Fees">
                        Fees
                    </option>

                    <option value="Certificates">
                        Certificates
                    </option>

                </select>

                <button type="submit">
                    Get Queue Number
                </button>

            </form>

            <div id="ticket"></div>

        </section>

        <section class="card">

            <h2>Current Queue</h2>

            <div id="queueList">

                <p>No students in queue.</p>

            </div>

            <button id="nextButton">
                Call Next Student
            </button>

            <button id="clearButton" class="clear">
                Clear Queue
            </button>

            <div id="serving"></div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

                  </html>
